buildscript {
    repositories {
        maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    }
    dependencies {
        classpath 'org.spongepowered:mixingradle:0.7-SNAPSHOT'
    }
}

plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

apply plugin: 'org.spongepowered.mixin'

version = mod_version
group = mod_group_id

base {
    archivesName = 'LuokixiVisuals'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'

            mods {
                luokixivisuals {
                    source sourceSets.main
                }
            }
        }

        client {}

        server {
            args '--nogui'
        }
    }
}

mixin {
    add sourceSets.main, 'luokixivisuals.refmap.json'
    config 'luokixivisuals.mixins.json'
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]

    inputs.properties replaceProperties

    filesMatching('META-INF/mods.toml') {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'             : 'luokixivisuals.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

// Keep the project self-contained and prevent Forge MDK sample/lobby leftovers from being packaged.
tasks.register('luokixiSanityCheck') {
    doLast {
        def forbidden = [
                'ExampleMod', 'examplemod',
                'YsmShowcaseBridge', 'ClientCompatibilityDoctor', 'ShowcaseStatePacket',
                'PlayerPreviewEntity', 'showcase_set', 'showcase_clear', 'showcase_sync',
                'projection_ring.png'
        ]
        def textExtensions = ['java', 'json', 'toml', 'mcmeta', 'properties', 'gradle'] as Set
        def hits = []
        fileTree('src').files.findAll { it.isFile() && textExtensions.contains(it.name.tokenize('.').last()) }.each { f ->
            def text = f.getText('UTF-8')
            forbidden.each { token ->
                if (text.contains(token)) hits << "${f}: ${token}"
            }
        }
        if (!hits.isEmpty()) {
            throw new GradleException('Forbidden Forge-MDK/example or removed lobby content found:\n' + hits.unique().sort().join('\n'))
        }
    }
}

tasks.named('compileJava').configure { dependsOn 'luokixiSanityCheck' }
tasks.named('processResources').configure { dependsOn 'luokixiSanityCheck' }
